
name: Android APK Builder

on:
  push:
    branches: [ "principal" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extrair projeto Android
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' -type f | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Arquivo ZIP nao encontrado"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted

      - name: Compilar APK
        run: |
          cd extracted/MediaDownloaderBrowser
          gradle --no-daemon :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloaderBrowser-APK
          path: extracted/MediaDownloaderBrowser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
