name: Build FivemL Browser

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: "8.9"

jobs:
  build:
    name: Validate and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project (ZIP or source tree)
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name '*.zip' -not -path '*/.git/*' -printf '%T@ %p\n' | sort -nr | sed -n '1s/^[^ ]* //p')"
          if [ -n "$ZIP_FILE" ]; then
            echo "Using archive: $ZIP_FILE"
            rm -rf "$GITHUB_WORKSPACE/_unpacked"
            mkdir -p "$GITHUB_WORKSPACE/_unpacked"
            unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_unpacked"
            SEARCH_ROOT="$GITHUB_WORKSPACE/_unpacked"
          else
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi
          APP_GRADLE="$(find "$SEARCH_ROOT" -type f -path '*/app/build.gradle.kts' -not -path '*/build/*' -print -quit)"
          test -n "$APP_GRADLE" || { echo 'app/build.gradle.kts not found' >&2; exit 1; }
          ROOT="$(dirname "$(dirname "$APP_GRADLE")")"
          test -f "$ROOT/settings.gradle.kts" || { echo 'settings.gradle.kts not found' >&2; exit 1; }
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Validate version, features and XML resources
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          grep -Fq 'tabPreview' app/src/main/java/com/fiveml/browser/ui/TabAdapter.kt
          grep -Fq 'safeBrowsingEnabled = prefs.safeBrowsingEnabled' app/src/main/java/com/fiveml/browser/ui/MainActivity.kt
          grep -Fq 'prefs.menuPosition' app/src/main/java/com/fiveml/browser/ui/MainActivity.kt
          grep -Fq 'val knownMedia = tab.media[target]' app/src/main/java/com/fiveml/browser/ui/MainActivity.kt
          if grep -Fq 'HitTestResult.VIDEO_TYPE' app/src/main/java/com/fiveml/browser/ui/MainActivity.kt; then
            echo 'Unsupported VIDEO_TYPE reference detected' >&2; exit 1
          fi
          python3 - <<'PYXML'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('app/src/main').rglob('*.xml'))
          for f in files: ET.parse(f)
          print(f'Validated {len(files)} XML resources')
          PYXML
          echo "APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=FivemL-Browser-$VERSION_NAME.apk" >> "$GITHUB_ENV"
          echo "Validated FivemL Browser $VERSION_NAME ($VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle wrapper when absent
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version "$GRADLE_VERSION" --no-daemon; fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SOURCE"
          cp "$SOURCE" "$GITHUB_WORKSPACE/$APK_NAME"
          echo "APK size: $(du -h "$GITHUB_WORKSPACE/$APK_NAME" | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FivemL-Browser-${{ env.APP_VERSION }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: FivemL Browser ${{ env.APP_VERSION }}
          files: ${{ env.APK_NAME }}
          
