name: Build FivemL Browser

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APK_NAME: FivemL-Browser.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project root
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name settings.gradle.kts -not -path '*/.git/*' -printf '%h\n' | head -n 1)"
          if [ -z "$ROOT" ] || [ ! -f "$ROOT/app/build.gradle.kts" ]; then
            echo "Android project (settings.gradle.kts + app/build.gradle.kts) not found" >&2
            exit 1
          fi
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          chmod +x gradlew

      - name: Assemble APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          set -euo pipefail
          SRC="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"
          cp "$SRC" "$GITHUB_WORKSPACE/$APK_NAME"
          file "$GITHUB_WORKSPACE/$APK_NAME" || true
          ls -l "$GITHUB_WORKSPACE/$APK_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FivemL-Browser
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: FivemL Browser ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          files: ${{ env.APK_NAME }}
          
