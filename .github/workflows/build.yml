
name: Criar APK de depuração

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e preparar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "settings.gradle" && ! -f "settings.gradle.kts" ]]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit || true)"
            if [[ -n "$ZIP_FILE" ]]; then
              mkdir -p "$RUNNER_TEMP/fiveml-project"
              unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/fiveml-project"
            fi
          fi

          SETTINGS_FILE="$(find . "$RUNNER_TEMP/fiveml-project" -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.gradle/*' -print -quit 2>/dev/null || true)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERRO: arquivos Gradle não encontrados."
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" && ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERRO: app/build.gradle não encontrado."
            exit 1
          fi

          echo "Projeto localizado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Compilar APK Debug
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FivemL-Browser-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
