name: Build Troy Browser

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APK_NAME: Troy-Browser.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate or extract project root
        shell: bash
        run: |
          set -euo pipefail

          find_app_gradle() {
            find "$GITHUB_WORKSPACE" -type f -path '*/app/build.gradle.kts' \
              -not -path '*/.git/*' -not -path '*/build/*' -print -quit
          }

          APP_GRADLE="$(find_app_gradle)"

          # Fallback: projeto enviado compactado dentro do repositório
          if [ -z "$APP_GRADLE" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name '*.zip' -print -quit)"
            if [ -n "$ZIP_FILE" ]; then
              echo "Unpacking archive: $ZIP_FILE"
              unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_unpacked"
              APP_GRADLE="$(find_app_gradle)"
            fi
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "Android app module (app/build.gradle.kts) not found." >&2
            exit 1
          fi

          ROOT="$(dirname "$(dirname "$APP_GRADLE")")"
          echo "Android project root: $ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          chmod +x gradlew

      - name: Assemble APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          set -euo pipefail
          SRC="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"
          cp "$SRC" "$GITHUB_WORKSPACE/$APK_NAME"
          ls -l "$GITHUB_WORKSPACE/$APK_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Troy-Browser
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Troy Browser ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          files: ${{ env.APK_NAME }}
          
