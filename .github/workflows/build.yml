name: Criar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/fiveml"

          find . -type f -name '*.zip' -print0 |
          while IFS= read -r -d '' file; do
            unzip -oq "$file" -d "$RUNNER_TEMP/fiveml"
          done

          SETTINGS=$(find . "$RUNNER_TEMP/fiveml" \
            -type f \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.gradle/*' -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Projeto Gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(realpath "$SETTINGS")")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Arquivo Gradle do módulo app não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FivemL-Browser-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
